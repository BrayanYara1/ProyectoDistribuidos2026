version: '3.8'

services:
  identity-access-db:
    image: postgres:15-alpine
    container_name: appt-identity-access-db
    environment:
      POSTGRES_DB: iam_db
      POSTGRES_USER: iam_user
      POSTGRES_PASSWORD: iam_password
    ports:
      - "5432:5432"

  appointment-db:
    image: postgres:15-alpine
    container_name: appt-appointment-db
    environment:
      POSTGRES_DB: appointment_db
      POSTGRES_USER: appt_user
      POSTGRES_PASSWORD: appt_password
    ports:
      - "5433:5432"

  identity-access-api:
    build: ../appt-mgmt-identity-access-api
    container_name: appt-identity-access-api
    environment:
      PORT: 3001
      DB_HOST: identity-access-db
      JWT_SECRET: supersecretkey2026
    ports:
      - "3001:3001"
    depends_on:
      - identity-access-db

  appointment-api:
    build: ../appt-mgmt-appointment-api
    container_name: appt-appointment-api
    environment:
      PORT: 3002
      DB_HOST: appointment-db
    ports:
      - "3002:3002"
    depends_on:
      - appointment-db

  workflow:
    build: ../appt-mgmt-workflow
    container_name: appt-workflow
    environment:
      PORT: 3003
    ports:
      - "3003:3003"

  api-gateway:
    build: ../appt-mgmt-api-gateway
    container_name: appt-api-gateway
    environment:
      PORT: 8080
      IAM_API_URL: http://identity-access-api:3001
      APPOINTMENT_API_URL: http://appointment-api:3002
      WORKFLOW_URL: http://workflow:3003
    ports:
      - "8080:8080"
    depends_on:
      - identity-access-api
      - appointment-api
      - workflow

  front:
    build: ../appt-mgmt-front
    container_name: appt-front
    ports:
      - "80:80"
    depends_on:
      - api-gateway
