services:
  mongodb:
    image: mongo:7.0
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  rabbitmq:
    image: rabbitmq:3.13-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  auth-service:
    build:
      context: ./backend
    restart: unless-stopped
    command: ["node", "services/auth-service/server.js"]
    environment:
      AUTH_PORT: 3001
      MONGODB_URI: mongodb://mongodb:27017/SaludActiva
      JWT_SECRET: ${JWT_SECRET:-local-development-jwt-secret-change-before-deploy}
      SERVICE_TOKEN: ${SERVICE_TOKEN:-local-development-service-token}
      NODE_ENV: development
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  appointments-service:
    build:
      context: ./backend
    restart: unless-stopped
    command: ["node", "services/appointments-service/server.js"]
    environment:
      APPOINTMENTS_PORT: 3002
      MONGODB_URI: mongodb://mongodb:27017/SaludActiva
      JWT_SECRET: ${JWT_SECRET:-local-development-jwt-secret-change-before-deploy}
      SERVICE_TOKEN: ${SERVICE_TOKEN:-local-development-service-token}
      AUTH_SERVICE_URL: http://auth-service:3001
      RABBITMQ_URL: amqp://rabbitmq:5672
      DEMO_FAILURE_ENABLED: ${DEMO_FAILURE_ENABLED:-true}
      DEMO_FAILURE_TOKEN: ${DEMO_FAILURE_TOKEN:-local-demo-failure-token}
      NODE_ENV: development
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      PORT: 3000
      MONGODB_URI: mongodb://mongodb:27017/SaludActiva
      JWT_SECRET: ${JWT_SECRET:-local-development-jwt-secret-change-before-deploy}
      SERVICE_TOKEN: ${SERVICE_TOKEN:-local-development-service-token}
      AUTH_SERVICE_URL: http://auth-service:3001
      APPOINTMENTS_SERVICE_URL: http://appointments-service:3002
      NODE_ENV: development
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    depends_on:
      mongodb:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      appointments-service:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health/live').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s

volumes:
  mongodb_data:
